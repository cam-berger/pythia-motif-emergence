[project]
name = "pythia-motif-emergence"
version = "0.0.1"
description = "Mech-interp study of attention-head motif emergence across Pythia training checkpoints"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }

dependencies = [
    "torch==2.11.0",
    "transformer-lens>=3.0",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "matplotlib",
    "seaborn",
    "einops",
    "pyyaml",
    "tqdm",
    "jupyter",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length is enforced by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
